<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Our Little Phone · Aaru & Somo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="phone-gallery.css">
</head>
<body>
  <main class="phone-shell-wrap">
    <div class="phone-shell" id="phoneShell">
      <div class="phone-speaker"></div>
      <div class="phone-screen">
        <header class="phone-topbar">
          <a href="bedroom.html" class="phone-back" aria-label="Back to bedroom">‹</a>
          <span class="phone-time" id="phoneTime">10:24</span>
          <span class="phone-status">● ● ▰</span>
        </header>

        <section class="phone-home" id="profileChooser">
          <div class="phone-app-title">Our Memories</div>
          <div class="phone-app-subtitle">Whose memories?</div>
          <div class="profile-options" id="profileOptions">
            <article class="profile-card" id="profileCardAaru" data-profile="Aaru">
              <button class="profile-main" type="button" onclick="window.__openPhoneProfileFallback('Aaru')" aria-label="Open Aaru's memories">
                <div class="profile-avatar-wrap">
                  <img class="profile-avatar" id="profileAvatarAaru" alt="Aaru profile picture">
                  <span class="profile-placeholder" id="profilePlaceholderAaru">A</span>
                </div>
                <span class="profile-name">Aaru</span>
              </button>
              <label class="profile-upload" id="profileUploadAaru">+ Add photo
                <input id="profileInputAaru" type="file" accept="image/*">
              </label>
            </article>
            <article class="profile-card" id="profileCardSomo" data-profile="Somo">
              <button class="profile-main" type="button" onclick="window.__openPhoneProfileFallback('Somo')" aria-label="Open Somo's memories">
                <div class="profile-avatar-wrap">
                  <img class="profile-avatar" id="profileAvatarSomo" alt="Somo profile picture">
                  <span class="profile-placeholder" id="profilePlaceholderSomo">S</span>
                </div>
                <span class="profile-name">Somo</span>
              </button>
              <label class="profile-upload" id="profileUploadSomo">+ Add photo
                <input id="profileInputSomo" type="file" accept="image/*">
              </label>
            </article>
          </div>
          <div class="phone-hint">Choose a collection to open it.</div>
        </section>

        <section class="phone-gallery-view" id="galleryView" hidden>
          <header class="gallery-appbar">
            <button class="gallery-back" id="galleryBack" type="button" aria-label="Back">‹</button>
            <div>
              <div class="gallery-name" id="galleryTitle">Aaru</div>
              <div class="gallery-count" id="galleryCount">0 photos</div>
            </div>
            <label class="add-photo" id="uploadLabel" title="Add photos">
              ＋
              <input id="photoInput" type="file" accept="image/*" multiple>
            </label>
          </header>
          <div class="gallery-status" id="uploadStatus" aria-live="polite"></div>
          <div class="photo-grid" id="photoGrid" aria-live="polite"></div>
        </section>

        <section class="phone-photo-viewer" id="photoViewer" aria-hidden="true">
          <div class="viewer-topbar">
            <button id="viewerClose" type="button">‹</button>
            <span id="viewerCaption">1 / 1</span>
            <span></span>
          </div>
          <div class="viewer-stage">
            <button class="viewer-nav viewer-prev" id="viewerPrev" type="button">‹</button>
            <img id="viewerImage" src="" alt="Chat memory">
            <button class="viewer-nav viewer-next" id="viewerNext" type="button">›</button>
          </div>
          <div class="viewer-bottom" id="viewerDeleteWrap"></div>
        </section>

        <div class="phone-home-indicator"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="protect.js"></script>

  <script>
    // Immediate navigation: this is deliberately independent of Supabase.
    window.__openPhoneProfileFallback = function(profile) {
      var chooser = document.getElementById('profileChooser');
      var gallery = document.getElementById('galleryView');
      var title = document.getElementById('galleryTitle');
      if (!chooser || !gallery) return false;
      chooser.hidden = true;
      chooser.style.display = 'none';
      gallery.hidden = false;
      gallery.style.display = 'block';
      if (title) title.textContent = profile + "'s Memories";
      if (typeof window.openPhoneProfile === 'function') {
        window.openPhoneProfile(profile).catch(function(err){ console.error(err); });
      }
      return false;
    };
  </script>
  <script src="phone-gallery.js?v=20261011-safe-delete-2"></script>
</body>
</html>
