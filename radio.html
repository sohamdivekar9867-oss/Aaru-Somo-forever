<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#291b1b">
  <title>Background Radio · Aaru & Somo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="radio.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="auth.js" defer></script>
  <script src="protect.js" defer></script>
  <script src="radio.js" defer></script>
</head>
<body>
  <main class="radio-page">
    <a class="radio-back" href="index.html" aria-label="Back to our room">‹</a>
    <div class="radio-shell">
      <header class="radio-heading">
        <h1>My Background Radio <span>♡</span></h1>
        <p class="radio-subtitle">The voice I want to wake up to listening to every single morning</p>
      </header>

      <section class="cassette-deck" id="cassetteDeck" aria-label="Background Radio cassette controls">
        <div class="cassette-label">
          <div class="cassette-controls">
            <button class="cassette-action" id="addSongToggle" type="button" aria-label="Add a song" aria-expanded="false">+</button>
            <div class="cassette-add-panel" id="radioAddPanel" hidden>
              <form id="radioUploadForm">
                <label class="title-field" for="radioTitle">Song title
                  <input id="radioTitle" type="text" maxlength="120" placeholder="Optional">
                </label>
                <label class="file-picker" for="radioFile">
                  <span class="file-icon">↑</span>
                  <span><strong id="fileName">Upload MP4 or M4A</strong><small>Up to 50 MB</small></span>
                  <input id="radioFile" type="file" accept=".mp4,.m4a,video/mp4,audio/mp4,audio/x-m4a" required>
                </label>
                <button class="upload-button cassette-add-confirm" id="uploadButton" type="submit" hidden>Add</button>
              </form>
            </div>
            <button class="cassette-action" id="deleteModeToggle" type="button" aria-label="Choose a song to delete" aria-pressed="false">−</button>
          </div>
          <p class="cassette-hint" id="deleteModeHint" hidden>Choose one of your songs below to remove.</p>
          <p class="radio-message" id="radioMessage" role="status" aria-live="polite"></p>
        </div>
        <div class="cassette-window" aria-hidden="true">
          <div class="reel reel-left"><i></i></div>
          <div class="tape-line"></div>
          <div class="reel reel-right"><i></i></div>
        </div>
        <div class="cassette-screws" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </section>

      <section class="radio-library">
        <div class="section-heading">
          <div><p class="radio-kicker">ON OUR TAPE</p></div>
          <span class="track-count" id="trackCount">— tracks</span>
        </div>
        <div class="track-list" id="trackList">
          <p class="empty-library">Tuning in…</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
