<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="auth.js" defer></script>
  <script src="protect.js" defer></script>
  <script src="bedroom.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Come here, Aaru… ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bedroom.css">
</head>
<body>
  <main class="bedroom-page">
    <div class="bedroom-stage">
      <img
        src="assets/pixel-bedroom.png"
        alt="A cozy romantic bedroom with a green bed and moonlit window"
        class="bedroom-image"
      >
      <div class="live-bedroom-clock" id="liveBedroomClock" aria-label="Current time">
        <div class="live-clock-time" id="liveClockTime">--:--</div>
        <div class="live-clock-date" id="liveClockDate">---</div>
      </div>
      <button class="bed-hotspot" id="bedHotspot" data-title="Our Bed" aria-label="Sit together on the bed"></button>

      <!-- Permanent owl messenger. It glows only when unread letters exist. -->
      <button class="owl-hotspot" id="owlHotspot" type="button" data-title="Love Letters" aria-label="Open unread love letters">
        <span class="owl-unread-dot" id="owlUnreadDot" aria-hidden="true"></span>
      </button>

      <!-- The right bedside drawer acts as our Love Letter Locker. -->
      <button class="locker-hotspot" id="lockerHotspot" type="button" data-title="Love Letter Locker" aria-label="Open our Love Letter Locker"></button>
      <!-- Mobile phone: our shared chat-photo gallery. -->
      <button class="phone-hotspot" id="phoneHotspot" type="button" data-title="Phone Photos" aria-label="Open our chat photo gallery"></button>
      <!-- Tablet: Somo's private diary and notes -->
      <button class="tablet-hotspot" id="tabletHotspot" type="button" data-title="Somo's Tablet" aria-label="Open Somo's tablet"></button>
    </div>

    <a class="bedroom-back" href="index.html" aria-label="Back to our room">←</a>
  </main>

  <section class="bed-interaction" id="bedInteraction" aria-hidden="true">
    <div class="bed-interaction-backdrop" id="bedInteractionBackdrop"></div>

    <div class="chibi-stage" id="chibiStage">
      <img id="chibiImageA" class="chibi-composite is-visible" src="assets/bed-chibis/initial image.png" alt="Aaru and Somo">
      <img id="chibiImageB" class="chibi-composite" src="assets/bed-chibis/initial image.png" alt="">

      <button class="character-hotspot aaru-hotspot" id="aaruHotspot" type="button" aria-label="Talk to Aaru"></button>
      <button class="character-hotspot somo-hotspot" id="somoHotspot" type="button" aria-label="Talk to Somo"></button>

      <div class="speech-bubble speech-bubble-aaru" id="aaruSpeech" aria-live="polite" aria-hidden="true"></div>
      <div class="speech-bubble speech-bubble-somo" id="somoSpeech" aria-live="polite" aria-hidden="true"></div>
    </div>

    <div class="bed-dialogue" role="dialog" aria-modal="true" aria-labelledby="bedDialogueTitle">
      <button class="dialogue-close" id="dialogueClose" aria-label="Close">×</button>
      <div class="dialogue-name" id="bedDialogueName">Aaru & Somo</div>
      <h2 id="bedDialogueTitle">A quiet little moment, just for us. ♡</h2>
      <p id="bedDialogueText">Come sit with me for a while.</p>

      <div class="bed-forward-wrap" id="bedForwardWrap" hidden>
        <button class="bed-forward" id="bedForward" type="button">Next →</button>
      </div>
      <div class="bed-actions" id="bedActions"></div>
    </div>
  </section>


  <!-- Unread love letters delivered by the owl -->
  <section class="owl-letters-modal" id="owlLettersModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="owlLettersTitle">
    <div class="owl-letters-backdrop" id="owlLettersBackdrop"></div>
    <div class="owl-letters-card">
      <button class="owl-letters-close" id="owlLettersClose" type="button" aria-label="Close">×</button>
      <div class="owl-letters-kicker">🦉 A LITTLE DELIVERY</div>
      <h2 id="owlLettersTitle">Letters waiting for you ❤️</h2>
      <p class="owl-letters-intro" id="owlLettersIntro">The owl brought something from the one you love.</p>
      <div class="owl-unread-list" id="owlUnreadList"></div>
    </div>
  </section>

  <!-- Clock countdown popup -->
  <section class="clock-countdown-modal" id="clockCountdownModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="clockCountdownTitle">
    <div class="clock-countdown-backdrop" id="clockCountdownBackdrop"></div>
    <div class="clock-countdown-card">
      <button class="clock-countdown-close" id="clockCountdownClose" type="button" aria-label="Close">×</button>
      <div class="clock-countdown-kicker" id="clockCountdownKicker">❤️ OUR NEXT DATE</div>
      <h2 id="clockCountdownTitle">Counting down until we meet again…</h2>
      <div class="countdown-grid" id="countdownGrid" aria-live="polite">
        <div class="countdown-unit"><strong id="countdownDays">00</strong><span>Days</span></div>
        <div class="countdown-unit"><strong id="countdownHours">00</strong><span>Hours</span></div>
        <div class="countdown-unit"><strong id="countdownMinutes">00</strong><span>Minutes</span></div>
        <div class="countdown-unit"><strong id="countdownSeconds">00</strong><span>Seconds</span></div>
      </div>
      <p class="countdown-date-label" id="countdownDateLabel"></p>
    </div>
  </section>

  <script>
    document.getElementById('tabletHotspot')?.addEventListener('click', () => {
      window.location.href = 'tablet.html';
    });
  </script>
</body>
</html>
